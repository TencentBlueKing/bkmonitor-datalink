# 节点管理 V3 插件包的 project.yaml，打包时放到 bk-collector/project.yaml（control.sh package_v3）
# V2 插件包仍使用 linux/x86_64/project.yaml，两者互不影响
#
# - name 必须与插件包顶层目录名一致
# - templateRenderer 使用 jinja2：与 V2 共用同一份配置模板，监控下发的模板上下文也无需调整
# - legacyConflict 为 true：通过插件 Install API 安装时，若主机上仍有运行中的 V2 bk-collector（nodeman 运行空间）则阻断，
#   避免新旧进程争抢 4317/4318 等固定端口；该检查不会自动停止 V2 实例
name: bk-collector
version: 0.0.1
description: 腾讯蓝鲸的 APM 服务端组件，负责接收蓝鲸监控的自定义时序指标及自定义事件上报，以及 Prometheus、OpenTelemetry、Jaeger，Skywalking 等主流开源组件的遥测数据
descriptionEn: BlueKing APM server component that receives custom time series and custom events reported to BlueKing Monitor, as well as telemetry data from mainstream open source components such as Prometheus, OpenTelemetry, Jaeger and SkyWalking
scenario: 蓝鲸监控，日志检索，应用性能监控等相关的数据. 首次使用插件管理进行操作前，先到相关平台进行设置插件的功能项
scenarioEn: Data for BlueKing Monitor, Log Search, APM and related platforms. Before managing this plugin for the first time, configure its features on the related platforms
launchNode: all
templateRenderer: jinja2
legacyConflict: true
