name: Linkd images

# 仅人工触发；push、PR、Git tag 和 Release 均不触发打包。
on:
  workflow_dispatch:
    inputs:
      component:
        description: 构建目标（all 仅构建两个镜像，helm 仅打包 Chart）
        type: choice
        options:
          - all
          - linkd
          - linkd-console
          - helm
        default: all
      version:
        description: 可选版本标签（如 v0.1.0-rc.1）；留空仅发布唯一构建标签
        type: string
        default: ""
      chart_version:
        description: 仅 helm 使用；留空沿用 Chart.yaml 的 version（SemVer）
        type: string
        default: ""

permissions:
  contents: read

# 同一版本串行发布，避免并发覆盖；正在发布的任务不会被后续运行取消。
concurrency:
  group: linkd-images-${{ inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
      image-prefix: ${{ steps.metadata.outputs.image-prefix }}
      build-tag: ${{ steps.metadata.outputs.build-tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Validate inputs and prepare shared version
        id: metadata
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 输入通过环境变量传入，避免把人工输入插入 shell 源码。
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::version 必须是合法的 Docker tag（最长 128 字符）'
            exit 1
          fi
          case "$COMPONENT" in
            all) components='["linkd","linkd-console"]' ;;
            linkd) components='["linkd"]' ;;
            linkd-console) components='["linkd-console"]' ;;
            helm) components='[]' ;;
            *) echo '::error::未知的 component'; exit 1 ;;
          esac
          # 重跑可能拉取不同的基础镜像；run attempt 区分同一提交的不同构建。
          build_tag="sha-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          {
            echo "matrix={\"component\":$components}"
            echo "image-prefix=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "build-tag=$build_tag"
            echo "version=${VERSION:-$build_tag}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and push ${{ matrix.component }}
    if: ${{ inputs.component != 'helm' }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check build context
        shell: bash
        env:
          CONTEXT: ${{ matrix.component == 'linkd' && 'pkg/linkd' || 'pkg/linkd/console' }}
        run: |
          if [[ ! -f "$CONTEXT/Dockerfile" ]]; then
            echo '::error::所选分支缺少 Dockerfile，请选择包含 Linkd 源码的分支（如 feat/linkd-dev）'
            exit 1
          fi

      - name: Prepare image tags
        id: image
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image-prefix }}/${{ matrix.component }}
          BUILD_TAG: ${{ needs.prepare.outputs.build-tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo 'tags<<EOF'
            echo "$IMAGE:$BUILD_TAG"
            if [[ "$VERSION" != "$BUILD_TAG" ]]; then
              echo "$IMAGE:$VERSION"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.component == 'linkd' && 'pkg/linkd' || 'pkg/linkd/console' }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Summarize published image
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image-prefix }}/${{ matrix.component }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_TAG: ${{ needs.prepare.outputs.build-tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '### %s\n\n' "$IMAGE"
            printf -- '- 版本：`%s:%s`\n' "$IMAGE" "$VERSION"
            printf -- '- 构建标签：`%s:%s`\n' "$IMAGE" "$BUILD_TAG"
            printf -- '- 固定产物：`%s@%s`\n' "$IMAGE" "$DIGEST"
            printf -- '- 源码提交：`%s`\n' "$GITHUB_SHA"
            printf -- '- 平台：`linux/amd64`\n'
          } >> "$GITHUB_STEP_SUMMARY"

  package-chart:
    name: Package Helm chart
    if: ${{ inputs.component == 'helm' }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      artifact-metadata: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check chart source
        shell: bash
        run: |
          if [[ ! -f pkg/linkd/deploy/helm/linkd/Chart.yaml ]]; then
            echo '::error::所选分支缺少 Helm Chart，请选择包含 Linkd Chart 的分支（如 feat/linkd-dev）'
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
        with:
          version: v3.17.3

      - name: Validate and package chart
        shell: bash
        env:
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          set -euo pipefail
          chart=pkg/linkd/deploy/helm/linkd
          values=(
            -f "$chart/examples/external-services.yaml"
            -f "$chart/examples/clusters.yaml"
            -f "$chart/examples/console-ingress.yaml"
            -f "$chart/examples/servicemonitor.yaml"
          )
          helm lint --strict "$chart" "${values[@]}"
          helm template linkd "$chart" "${values[@]}" > "$RUNNER_TEMP/linkd-rendered.yaml"
          package_args=()
          if [[ -n "$CHART_VERSION" ]]; then
            package_args+=(--version "$CHART_VERSION")
          fi
          mkdir -p dist/linkd-chart
          # 只打包所选提交的 Chart；不改写其 appVersion 或镜像默认值。
          helm package "$chart" --destination dist/linkd-chart "${package_args[@]}"
          cd dist/linkd-chart
          sha256sum ./*.tgz > SHA256SUMS

      - name: Upload chart artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linkd-chart-${{ github.run_id }}.${{ github.run_attempt }}
          path: dist/linkd-chart/
          if-no-files-found: error
          retention-days: 30

      - name: Attest chart provenance
        if: ${{ github.event.repository.owner.type == 'Organization' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/linkd-chart/linkd-*.tgz

      - name: Register chart in linked artifacts
        if: ${{ github.event.repository.owner.type == 'Organization' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          set -euo pipefail
          packages=(dist/linkd-chart/linkd-*.tgz)
          if [[ ${#packages[@]} -ne 1 || ! -f "${packages[0]}" ]]; then
            echo '::error::登记 Linked artifacts 时必须恰好存在一个 Chart 包'
            exit 1
          fi
          package="${packages[0]}"
          filename="${package##*/}"
          chart_version="${filename#linkd-}"
          chart_version="${chart_version%.tgz}"
          # 使用 .tgz 本身的 digest，而非 upload-artifact 外层归档的 digest。
          digest="sha256:$(sha256sum "$package" | cut -d ' ' -f 1)"
          jq -n \
            --arg version "$chart_version" \
            --arg digest "$digest" \
            --arg url "$ARTIFACT_URL" \
            --arg filename "$filename" \
            --arg registry "$GITHUB_SERVER_URL" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg github_repository "${GITHUB_REPOSITORY#*/}" \
            '{name: "linkd-chart", version: $version, digest: $digest,
              artifact_url: $url, path: $filename, registry_url: $registry,
              repository: $repository, github_repository: $github_repository,
              status: "active"}' > "$RUNNER_TEMP/linkd-chart-storage-record.json"
          gh api --method POST \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "orgs/$GITHUB_REPOSITORY_OWNER/artifacts/metadata/storage-record" \
            --input "$RUNNER_TEMP/linkd-chart-storage-record.json"
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "orgs/$GITHUB_REPOSITORY_OWNER/artifacts/$digest/metadata/storage-records" \
            > "$RUNNER_TEMP/linkd-chart-storage-records.json"
          jq -e --arg url "$ARTIFACT_URL" \
            '.storage_records | any(.artifact_url == $url)' \
            "$RUNNER_TEMP/linkd-chart-storage-records.json"
          printf '[组织级 Linked artifacts](%s/orgs/%s/artifacts)\n\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY_OWNER" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize chart artifact
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            printf '### Helm Chart\n\n'
            printf '[下载 Chart 和校验和](%s)\n\n' "$ARTIFACT_URL"
            printf -- '- 源码提交：`%s`\n' "$GITHUB_SHA"
            printf -- '- 保留时间：30 天\n'
            printf -- '- 本次仅打包 Chart，没有构建或推送镜像。\n'
          } >> "$GITHUB_STEP_SUMMARY"
