# 独立使用，不与内联 configuration 示例叠加。
auth:
  existingSecret: linkd-auth
controlPlane:
  existingSecret: linkd-config
  secretKey: control-plane.yaml
clusters:
  default:
    labels: {pool: default}
    existingSecret: linkd-config
    secretKeys:
      cleaner: default-cleaner.yaml
      lifecycle: default-lifecycle.yaml
  alarmd:
    labels: {pool: alarmd}
    existingSecret: linkd-config
    secretKeys:
      cleaner: alarmd-cleaner.yaml
      lifecycle: alarmd-lifecycle.yaml
    cleaner:
      replicas: 1
    lifecycle:
      replicas: 1
