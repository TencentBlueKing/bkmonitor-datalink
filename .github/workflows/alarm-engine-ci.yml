name: Alarm Engine CI

on:
  pull_request:
    paths:
      - "pkg/alarm-engine/**"
      - "Makefile"
      - ".github/workflows/alarm-engine-ci.yml"
  push:
    branches:
      - master
    paths:
      - "pkg/alarm-engine/**"
      - "Makefile"
      - ".github/workflows/alarm-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alarm-engine-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Go 1.23
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.12"
          cache-dependency-path: pkg/alarm-engine/go.sum

      - name: Verify dependencies
        working-directory: pkg/alarm-engine
        run: |
          go mod verify
          go mod tidy -diff

      - name: Run unit tests and static analysis
        run: |
          make MODULE=alarm-engine test
          make MODULE=alarm-engine lint

      - name: Build Linux binary through repository entry point
        run: |
          task_release_path="$RUNNER_TEMP/alarm-engine-dist"
          make MODULE=alarm-engine BUILD_NO=1 RELEASE_PATH="$task_release_path" build
          binary="$task_release_path/alarm-engine/alarm-engine"
          test -x "$binary"
          build_info="$(go version -m "$binary")"
          grep -F "go1.23.12" <<<"$build_info"
          grep -F $'build\tCGO_ENABLED=0' <<<"$build_info"
          grep -F $'build\tGOARCH=amd64' <<<"$build_info"
          grep -F $'build\tGOOS=linux' <<<"$build_info"
