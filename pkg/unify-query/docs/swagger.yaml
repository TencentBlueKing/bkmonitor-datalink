basePath: /
definitions:
  cmdb.CompactTopology:
    properties:
      edge_occurrences:
        type: integer
      edges:
        items:
          $ref: '#/definitions/cmdb.CompactTopologyEdge'
        type: array
      node_occurrences:
        description: 出现次数按展开后的输出计数，不是字典条目数。
        type: integer
      nodes:
        items:
          $ref: '#/definitions/cmdb.CompactTopologyNode'
        type: array
      partial:
        items:
          $ref: '#/definitions/cmdb.CompactTopologyPartial'
        type: array
      timestamps:
        items:
          type: integer
        type: array
      version:
        type: integer
    type: object
  cmdb.CompactTopologyEdge:
    properties:
      category:
        type: string
      direction:
        type: string
      mask:
        items:
          type: string
        type: array
      metric_name:
        type: string
      relation_type:
        type: string
      source:
        type: string
      target:
        type: string
    type: object
  cmdb.CompactTopologyNode:
    properties:
      dimensions:
        $ref: '#/definitions/cmdb.Matcher'
      id:
        type: string
      mask:
        items:
          type: string
        type: array
      resource_type:
        type: string
    type: object
  cmdb.CompactTopologyPartial:
    properties:
      index:
        type: integer
      reason:
        type: string
    type: object
  cmdb.Matcher:
    additionalProperties:
      type: string
    type: object
  cmdb.MatchersWithTimestamp:
    properties:
      items:
        items:
          $ref: '#/definitions/cmdb.Matcher'
        type: array
      timestamp:
        type: integer
    type: object
  cmdb.PathNode:
    properties:
      dimensions:
        $ref: '#/definitions/cmdb.Matcher'
      resource_type:
        type: string
    type: object
  cmdb.PathResourcesResult:
    properties:
      path:
        items:
          $ref: '#/definitions/cmdb.PathNode'
        type: array
      target_type:
        type: string
      timestamp:
        type: integer
    type: object
  cmdb.RelationMultiResourcePathData:
    properties:
      path:
        items:
          type: string
        type: array
      target_list:
        items:
          $ref: '#/definitions/cmdb.Matcher'
        type: array
    type: object
  cmdb.RelationMultiResourceRangePathData:
    properties:
      path:
        items:
          type: string
        type: array
      target_list:
        items:
          $ref: '#/definitions/cmdb.MatchersWithTimestamp'
        type: array
    type: object
  cmdb.RelationMultiResourceRangeRequest:
    properties:
      query_list:
        items:
          properties:
            end_time:
              description: Range end in Unix seconds or milliseconds; used with start_time.
              type: integer
            look_back_delta:
              description: Positive Go duration; empty uses configured lookback (built-in
                24h), independent of range step.
              type: string
            path_resource:
              description: Optional legacy resource-type path; preserve the old target/path
                response contract.
              items:
                type: string
              type: array
            return_all_paths:
              type: boolean
            source_expand_info:
              allOf:
              - $ref: '#/definitions/cmdb.Matcher'
              description: Explicit source attribute predicates; preserve this object
                through consumer serializers.
            source_info:
              allOf:
              - $ref: '#/definitions/cmdb.Matcher'
              description: Source identity dimensions as strings; partial identities
                can match multiple roots.
            source_type:
              description: Source resource type. For path_resources, may be inferred
                from explicit path_resources.
              type: string
            start_time:
              description: Range start in Unix seconds or milliseconds; used with
                end_time.
              type: integer
            step:
              description: Positive whole-second Go duration; omitted defaults to
                1m.
              type: string
            target_info_show:
              description: Whether to return target information fields in the legacy
                target response.
              type: boolean
            target_type:
              description: Requested legacy target resource type, not a topology output
                filter.
              type: string
          type: object
        type: array
    type: object
  cmdb.RelationMultiResourceRangeResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/cmdb.RelationMultiResourceRangeResponseData'
        type: array
      trace_id:
        type: string
    type: object
  cmdb.RelationMultiResourceRangeResponseData:
    properties:
      code:
        type: integer
      message:
        type: string
      partial:
        type: boolean
      partial_reason:
        type: string
      path:
        items:
          type: string
        type: array
      paths:
        items:
          $ref: '#/definitions/cmdb.RelationMultiResourceRangePathData'
        type: array
      source_info:
        $ref: '#/definitions/cmdb.Matcher'
      source_type:
        type: string
      target_list:
        items:
          $ref: '#/definitions/cmdb.MatchersWithTimestamp'
        type: array
      target_type:
        type: string
      truncated:
        description: Truncated 表示响应是否因服务端安全上限而被截断。
        type: boolean
      truncated_reason:
        description: TruncatedReason 标识触发截断的具体上限，便于调用方区分处理。
        type: string
    type: object
  cmdb.RelationMultiResourceRequest:
    properties:
      query_list:
        items:
          properties:
            look_back_delta:
              description: Positive Go duration; empty uses configured lookback (built-in
                24h), independent of range step.
              type: string
            path_resource:
              description: Optional legacy resource-type path; preserve the old target/path
                response contract.
              items:
                type: string
              type: array
            return_all_paths:
              description: |-
                ReturnAllPaths 开启后，legacy 接口会额外返回所有可执行的静态路径。
                未开启时保持原有的首条有效路径语义。
              type: boolean
            source_expand_info:
              allOf:
              - $ref: '#/definitions/cmdb.Matcher'
              description: Explicit source attribute predicates; preserve this object
                through consumer serializers.
            source_info:
              allOf:
              - $ref: '#/definitions/cmdb.Matcher'
              description: Source identity dimensions as strings; partial identities
                can match multiple roots.
            source_type:
              description: Source resource type. For path_resources, may be inferred
                from explicit path_resources.
              type: string
            target_info_show:
              description: Whether to return target information fields in the legacy
                target response.
              type: boolean
            target_type:
              description: Requested legacy target resource type, not a topology output
                filter.
              type: string
            timestamp:
              description: Unix seconds or milliseconds; see the endpoint guide for
                instant/default-time behavior.
              type: integer
          type: object
        type: array
    type: object
  cmdb.RelationMultiResourceResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/cmdb.RelationMultiResourceResponseData'
        type: array
      trace_id:
        type: string
    type: object
  cmdb.RelationMultiResourceResponseData:
    properties:
      code:
        type: integer
      message:
        type: string
      partial:
        type: boolean
      partial_reason:
        type: string
      path:
        items:
          type: string
        type: array
      paths:
        items:
          $ref: '#/definitions/cmdb.RelationMultiResourcePathData'
        type: array
      source_info:
        $ref: '#/definitions/cmdb.Matcher'
      source_type:
        type: string
      target_list:
        items:
          $ref: '#/definitions/cmdb.Matcher'
        type: array
      target_type:
        type: string
      truncated:
        description: Truncated 表示响应是否因服务端安全上限而被截断。
        type: boolean
      truncated_reason:
        description: TruncatedReason 标识触发截断的具体上限，便于调用方区分处理。
        type: string
    type: object
  cmdb.RelationPathResourcesRangeRequest:
    properties:
      query_list:
        items:
          properties:
            end_time:
              description: Range end in Unix seconds or milliseconds; used with start_time.
              type: integer
            look_back_delta:
              description: Positive Go duration; empty uses configured lookback (built-in
                24h), independent of range step.
              type: string
            matcher:
              allOf:
              - $ref: '#/definitions/cmdb.Matcher'
              description: Source identity dimensions as strings for the explicit/derived
                paths.
            path_resources:
              description: Explicit resource-type paths; otherwise source_type and
                target_types drive path planning.
              items:
                items:
                  type: string
                type: array
              type: array
            source_type:
              description: Source resource type. For path_resources, may be inferred
                from explicit path_resources.
              type: string
            start_time:
              description: Range start in Unix seconds or milliseconds; used with
                end_time.
              type: integer
            step:
              description: Positive whole-second Go duration; omitted defaults to
                1m.
              type: string
            target_types:
              description: Requested path target types; topology uses a separate output-filter
                contract.
              items:
                type: string
              type: array
          type: object
        type: array
    type: object
  cmdb.RelationPathResourcesRangeResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/cmdb.RelationPathResourcesRangeResponseData'
        type: array
      trace_id:
        type: string
    type: object
  cmdb.RelationPathResourcesRangeResponseData:
    properties:
      code:
        type: integer
      message:
        type: string
      partial:
        type: boolean
      partial_reason:
        type: string
      results:
        items:
          $ref: '#/definitions/cmdb.PathResourcesResult'
        type: array
    type: object
  cmdb.RelationPathResourcesRequest:
    properties:
      query_list:
        items:
          properties:
            look_back_delta:
              description: Positive Go duration; empty uses configured lookback (built-in
                24h), independent of range step.
              type: string
            matcher:
              allOf:
              - $ref: '#/definitions/cmdb.Matcher'
              description: Source identity dimensions as strings for the explicit/derived
                paths.
            path_resources:
              description: Explicit resource-type paths; otherwise source_type and
                target_types drive path planning.
              items:
                items:
                  type: string
                type: array
              type: array
            source_type:
              description: Source resource type. For path_resources, may be inferred
                from explicit path_resources.
              type: string
            target_types:
              description: Requested path target types; topology uses a separate output-filter
                contract.
              items:
                type: string
              type: array
            timestamp:
              description: Unix seconds or milliseconds; see the endpoint guide for
                instant/default-time behavior.
              type: integer
          type: object
        type: array
    type: object
  cmdb.RelationPathResourcesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/cmdb.RelationPathResourcesResponseData'
        type: array
      trace_id:
        type: string
    type: object
  cmdb.RelationPathResourcesResponseData:
    properties:
      code:
        type: integer
      message:
        type: string
      partial:
        type: boolean
      partial_reason:
        type: string
      results:
        items:
          $ref: '#/definitions/cmdb.PathResourcesResult'
        type: array
    type: object
  cmdb.SharedTopologyEdge:
    properties:
      category:
        type: string
      direction:
        type: string
      metric_name:
        type: string
      relation_type:
        type: string
      source:
        type: integer
      target:
        type: integer
    type: object
  cmdb.SharedTopologyNode:
    properties:
      dimensions:
        $ref: '#/definitions/cmdb.Matcher'
      id:
        type: integer
      resource_type:
        type: string
    type: object
  cmdb.SharedTopologyQuery:
    properties:
      allowed_categories:
        description: Relation category allowlist. Empty allows all categories; unknown
          categories match no relations.
        items:
          type: string
        type: array
      allowed_relation_types:
        description: Exact relation-type allowlist from the active schema. Empty allows
          all types; unknown names match no relations. Intersects allowed_categories.
        items:
          type: string
        type: array
      dynamic_relation_direction:
        default: both
        description: Traversal orientation for directional relations; non-directional
          static relations remain bidirectional.
        enum:
        - both
        - outbound
        - inbound
        type: string
      end_time:
        description: Inclusive range end; must be >= start_time and exactly aligned
          to step. Same units as timestamp.
        type: integer
      look_back_delta:
        default: 24h
        description: Positive Go duration used by count_over_time observation windows,
          independent of step. Empty uses configured lookback (built-in 24h); observed
          edges do not prove exact simultaneous existence.
        type: string
      max_hops:
        default: 2
        description: Hop count. Zero/omitted uses configured default (built-in 2);
          negative is invalid. Ordinary-mode configured ceiling defaults to 5; YOLO
          bypasses the ceiling.
        minimum: 0
        type: integer
      response_format:
        default: snapshots
        description: Per-item output format. Omitted or empty selects snapshots; compact-v1
          is opt-in.
        enum:
        - snapshots
        - compact-v1
        type: string
      source_expand_info:
        allOf:
        - $ref: '#/definitions/cmdb.Matcher'
        description: Explicit root attribute predicates, evaluated per frame. Defined
          primary keys may complete identity, but conflicting identity or unknown
          fields fail. Does not filter neighbor attributes.
      source_info:
        allOf:
        - $ref: '#/definitions/cmdb.Matcher'
        description: Root identity matchers (string values). Partial or empty identity
          selects multiple relation endpoints; use the resource catalogue for complete
          primary keys.
      source_type:
        description: Root resource type from the active schema; required for either
          endpoint.
        type: string
      start_time:
        description: Required and nonzero with end_time for topology_range; forbidden
          for topology. Same units as timestamp.
        type: integer
      step:
        default: 1m
        description: Range grid spacing, a positive whole-second Go duration. Empty
          defaults to 1m. Independent of look_back_delta. Ignored by instant topology
          (response step 0s).
        type: string
      target_types:
        description: Output node-type filter after traversal, always retaining source_type
          nodes. Removes excluded nodes and incident edges, never collapses paths.
          Empty returns all reachable types.
        items:
          type: string
        type: array
      timestamp:
        description: Required and nonzero for topology; forbidden for topology_range.
          Unix seconds (<1e12) or whole-second Unix milliseconds (>=1e12). Responses
          always use milliseconds.
        type: integer
    required:
    - source_type
    type: object
  cmdb.SharedTopologyRequest:
    properties:
      query_list:
        description: Ordered batch; empty or omitted returns an empty data array.
          Each item has its own code; HTTP 200 alone does not imply all succeeded.
          Ordinary mode defaults to at most 16 items; YOLO bypasses this limit.
        items:
          $ref: '#/definitions/cmdb.SharedTopologyQuery'
        type: array
    type: object
  cmdb.SharedTopologySnapshot:
    properties:
      edges:
        items:
          $ref: '#/definitions/cmdb.SharedTopologyEdge'
        type: array
      nodes:
        items:
          $ref: '#/definitions/cmdb.SharedTopologyNode'
        type: array
      partial:
        type: boolean
      partial_reason:
        type: string
      timestamp:
        type: integer
    type: object
  github_com_TencentBlueKing_bkmonitor-datalink_pkg_unify-query_query_structured.AggregateMethod:
    properties:
      dimensions:
        description: Dimensions 聚合维度
        example:
        - bk_target_ip
        - bk_target_cloud_id
        items:
          type: string
        type: array
      field:
        description: Field 聚合字段，默认为指标字段，指定则会进行覆盖
        example: field
        type: string
      is_sub_query:
        description: IsSubQuery 判断是否为子查询
        type: boolean
      method:
        description: Method 聚合方法
        example: mean
        type: string
      window:
        description: Window 聚合周期
        example: 60s
        type: string
      without:
        description: Without
        type: boolean
    type: object
  github_com_TencentBlueKing_bkmonitor-datalink_pkg_unify-query_query_structured.ConditionField:
    properties:
      field_name:
        description: DimensionName 过滤字段
        example: bk_biz_id
        type: string
      is_prefix:
        description: IsPrefix 是否是前缀
        type: boolean
      is_suffix:
        description: IsSuffix 是否是后缀
        type: boolean
      is_wildcard:
        description: IsWildcard 是否是通配符
        type: boolean
      op:
        description: Operator 操作符，包含：eq,ne,erq,nreq,contains,ncontains
        example: contains
        type: string
      value:
        description: Value 查询值
        example:
        - "2"
        items:
          type: string
        type: array
    type: object
  github_com_TencentBlueKing_bkmonitor-datalink_pkg_unify-query_query_structured.Conditions:
    properties:
      condition_list:
        description: ConditionList 组合条件，长度 = len(FieldList) - 1的数组，支持 and,or
        example:
        - and
        items:
          type: string
        type: array
      field_list:
        description: FieldList 查询条件
        items:
          $ref: '#/definitions/github_com_TencentBlueKing_bkmonitor-datalink_pkg_unify-query_query_structured.ConditionField'
        type: array
    type: object
  github_com_TencentBlueKing_bkmonitor-datalink_pkg_unify-query_query_structured.Query:
    properties:
      collapse:
        allOf:
        - $ref: '#/definitions/metadata.Collapse'
        description: Collapse
      conditions:
        allOf:
        - $ref: '#/definitions/github_com_TencentBlueKing_bkmonitor-datalink_pkg_unify-query_query_structured.Conditions'
        description: Conditions 过滤条件
      dimensions:
        description: Dimensions promQL 使用维度
        example:
        - bk_target_ip
        - bk_target_cloud_id
        items:
          type: string
        type: array
      field_name:
        description: FieldName 查询指标
        example: usage
        type: string
      from:
        description: From 翻页开启数字
        example: 0
        type: integer
      function:
        description: AggregateMethodList 维度聚合函数
        items:
          $ref: '#/definitions/github_com_TencentBlueKing_bkmonitor-datalink_pkg_unify-query_query_structured.AggregateMethod'
        type: array
      is_dom_sampled:
        description: IsDomSampled 是否命中降采样算法
        type: boolean
      is_prefix:
        description: IsPrefix 是否启用前缀匹配
        type: boolean
      is_regexp:
        description: IsRegexp 指标是否使用正则查询
        example: false
        type: boolean
      limit:
        description: Limit 点数限制数量
        example: 0
        type: integer
      offset:
        description: Offset 偏移量
        example: ""
        type: string
      offset_forward:
        description: OffsetForward 偏移方向，默认 false 为向前偏移
        example: false
        type: boolean
      query_string:
        description: QueryString 关键字查询
        type: string
      reference_name:
        description: ReferenceName 别名，用于表达式计算
        example: a
        type: string
      slimit:
        description: Slimit 维度限制数量
        example: 0
        type: integer
      sql:
        description: SQL doris sql 解析
        type: string
      start_or_end:
        description: StartOrEnd @-modifier 标记，start or end
        type: integer
      table_id:
        description: TableID 数据实体ID，容器指标可以为空
        example: system.cpu_summary
        type: string
      table_id_conditions:
        description: TableIDConditions 表标签条件（Body table_id_conditions 与 PromQL __bk_query_label_selector_<维度>
          写入此字段，用于路由选表）；AllConditions 形态，内层 AND、外层 OR。
        items:
          items:
            $ref: '#/definitions/github_com_TencentBlueKing_bkmonitor-datalink_pkg_unify-query_query_structured.ConditionField'
          type: array
        type: array
      time_aggregation:
        allOf:
        - $ref: '#/definitions/github_com_TencentBlueKing_bkmonitor-datalink_pkg_unify-query_query_structured.TimeAggregation'
        description: TimeAggregation 时间聚合方法
      timestamp:
        description: Timestamp @-modifier 标记
        type: integer
      vector_offset:
        description: VectorOffset
        type: integer
    type: object
  github_com_TencentBlueKing_bkmonitor-datalink_pkg_unify-query_query_structured.QueryOutput:
    properties:
      expression:
        description: Expression 输出表达式；非 legacy 输出仅允许 query reference identity 表达式。
        example: A
        type: string
      reference_name:
        description: ReferenceName 输出引用名，在同一 output_list 中必须唯一。
        example: A
        type: string
    type: object
  github_com_TencentBlueKing_bkmonitor-datalink_pkg_unify-query_query_structured.QueryPromQL:
    properties:
      add_dimensions:
        description: AddDimensions 额外添加的聚合维度，会与每个 function.dimensions 合并
        items:
          type: string
        type: array
      bk_biz_ids:
        items:
          type: string
        type: array
      down_sample_range:
        description: DownSampleRange 降采样：大于Step才能生效，可以为空
        example: 5m
        type: string
      end:
        type: string
      instant:
        description: 瞬时数据
        type: boolean
      is_verify_dimensions:
        type: boolean
      legacy_output_ref:
        type: string
      limit:
        type: integer
      look_back_delta:
        description: LookBackDelta 偏移量
        type: string
      match:
        type: string
      max_source_resolution:
        type: string
      not_align_influxdb:
        description: 不与influxdb对齐
        type: boolean
      not_time_align:
        type: boolean
      output_list:
        items:
          $ref: '#/definitions/github_com_TencentBlueKing_bkmonitor-datalink_pkg_unify-query_query_structured.QueryOutput'
        type: array
      promql:
        type: string
      reference:
        type: boolean
      response_contract:
        type: string
      slimit:
        type: integer
      start:
        type: string
      step:
        type: string
      timezone:
        description: Timezone 时区
        example: Asia/Shanghai
        type: string
    type: object
  github_com_TencentBlueKing_bkmonitor-datalink_pkg_unify-query_query_structured.QueryTs:
    properties:
      add_dimensions:
        description: AddDimensions 额外添加的聚合维度，会与每个 function.dimensions 合并
        items:
          type: string
        type: array
      clear_cache:
        description: ClearCache 是否强制清理已存在的缓存会话
        type: boolean
      down_sample_range:
        description: DownSampleRange 降采样：大于Step才能生效，可以为空
        example: 5m
        type: string
      dry_run:
        description: DryRun 是否启用 DryRun
        type: boolean
      end_time:
        description: End 结束时间：单位为任意长度的时间戳
        example: "1657851600"
        type: string
      from:
        description: From 翻页起始位置。Doris SearchAfter 在缺少稳定游标字段时会降级为 offset 分页。
        example: 0
        type: integer
      highlight:
        allOf:
        - $ref: '#/definitions/metadata.HighLight'
        description: HighLight 是否开启高亮
      instant:
        description: Instant 瞬时数据
        type: boolean
      is_es_batch:
        description: IsESBatch 是否启用 query_raw 的 ES 批量查询
        type: boolean
      is_merge_db:
        description: IsMergeDB 是否启用合并 db 特性
        type: boolean
      is_multi_from:
        description: IsMultiFrom 是否启用 MultiFrom 查询
        type: boolean
      is_search_after:
        description: IsSearchAfter 是否启用 SearchAfter 查询。仅用于 /query/raw 原始查询：Elasticsearch
          使用原生游标；Doris 优先使用 __unique_key__，缺少时尝试 dtEventTimeStamp、gseIndex、iterationIndex
          组合游标，再缺少时降级为 offset 分页；不能与 scroll 同时使用。
        type: boolean
      legacy_output_ref:
        description: LegacyOutputRef 指向与 MetricMerge 等价的输出，供旧服务兼容降级。
        example: C
        type: string
      limit:
        description: |-
          增加公共限制
          Limit 点数限制数量
        example: 0
        type: integer
      look_back_delta:
        description: LookBackDelta 偏移量
        type: string
      metric_merge:
        description: MetricMerge 表达式：支持所有PromQL语法
        example: a
        type: string
      not_time_align:
        description: |-
          NotTimeAlign 查询开始时间和聚合是否需要对齐
          例如
          true:  range: 10:03 - 10:23 window: 10m -> 10:03 - 10:13, 10:13 - 10:23
          false: range: 10:03 - 10:23 window: 10m -> 10:00 - 10:10, 10:10 - 10:20, 10:20 - 10:23
        type: boolean
      order_by:
        description: OrderBy 排序字段列表，按顺序排序，负数代表倒序, ["_time", "-_time"]
        items:
          type: string
        type: array
      output_list:
        description: OutputList 按请求顺序声明命名输出。
        items:
          $ref: '#/definitions/github_com_TencentBlueKing_bkmonitor-datalink_pkg_unify-query_query_structured.QueryOutput'
        type: array
      query_list:
