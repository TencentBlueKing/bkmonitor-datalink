{{- if .Values.console.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "linkd.fullname" . }}-console
  {{- with .Values.console.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.console.ingress.ingressClassName }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.console.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.console.ingress.hostname | quote }}
      http:
        paths:
          - path: {{ .Values.console.basePath | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "linkd.fullname" . }}-console
                port:
                  number: {{ .Values.console.service.port }}
{{- end }}
