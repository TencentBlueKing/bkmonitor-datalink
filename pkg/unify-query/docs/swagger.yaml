        type: string
      snapshots:
        description: Snapshots is present only for the default/snapshots format, including
          failures.
        items:
          $ref: '#/definitions/cmdb.SharedTopologySnapshot'
        type: array
      start_time:
        type: integer
      step:
        type: string
    type: object
