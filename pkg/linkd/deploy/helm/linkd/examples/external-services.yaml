# 仅示例：使用 Chart 默认 GHCR 镜像，替换外部服务地址。认证 Secret 需预先创建。
auth:
  existingSecret: linkd-auth
configuration:
  # 各角色共用；仅启用相应处理器或 OneModel 调试时才连接。
  resources:
    mysql: {address: kingeye-mysql:3306, database: kingeye, username: reader, password: ""}
    onemodel:
      addresses: [http://onemodel:9200]
    kingeye_display:
      redis: {address: kingeye-redis:6379, database: 0}
      key_prefix: ""
  logging:
    level: info
    format: json
  storage:
    repository: elasticsearch
    elasticsearch:
      addresses: [http://elasticsearch:9200]
      index_prefix: linkd
    redis:
      address: redis:6379
  lifecycle:
    concurrency: 32
  control_plane:
    redis_stream: {}
