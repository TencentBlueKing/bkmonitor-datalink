{{- if .Values.eventgen.enabled }}
{{- $ctx := dict "root" . "workload" (dict "component" "eventgen") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "linkd.fullname" . }}-eventgen
  labels:
    {{- include "linkd.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "linkd.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "linkd.labels" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with concat .Values.global.imagePullSecrets .Values.eventgen.image.pullSecrets | uniq }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: eventgen
          image: {{ include "linkd.image" (dict "root" . "image" .Values.eventgen.image) | quote }}
          imagePullPolicy: {{ .Values.eventgen.image.pullPolicy }}
          args:
            - serve
            - --control-plane
            - {{ printf "http://%s-control-plane:%v" (include "linkd.fullname" .) .Values.service.port | quote }}
            - --poll-interval
            - {{ .Values.eventgen.pollInterval | quote }}
          env:
            - name: LINKD_EVENTGEN_WORKER_TOKEN
              {{- include "linkd.credential" (dict "secret" .Values.auth.existingSecret "key" .Values.auth.workerTokenKey "value" .Values.auth.workerToken) | nindent 14 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with concat .Values.extraVolumeMounts (.Values.eventgen.extraVolumeMounts | default list) }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.eventgen.resources | nindent 12 }}
      {{- with concat .Values.extraVolumes (.Values.eventgen.extraVolumes | default list) }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- range $field := list "nodeSelector" "affinity" "tolerations" "topologySpreadConstraints" }}
      {{- with index $.Values.eventgen $field | default (index $.Values $field) }}
      {{ $field }}:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
{{- end }}
