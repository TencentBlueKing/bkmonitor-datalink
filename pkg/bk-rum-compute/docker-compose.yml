services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      # 使用标准环境变量名（不带 KAFKA_CFG_ 前缀）
      - NODE_ID=1
      - PROCESS_ROLES=broker,controller
      - CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9092
      - ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      - LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - CONTROLLER_LISTENER_NAMES=CONTROLLER
      - AUTO_CREATE_TOPICS_ENABLE=false
      - ALLOW_PLAINTEXT_LISTENER=yes
      # 添加 CLUSTER_ID
      - CLUSTER_ID=5L6g3nShT-eMCtK--X86sw

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      - kafka
    entrypoint: [ "/bin/bash", "-lc" ]
    command: >
      "for i in {1..30}; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && break;
        sleep 2;
      done; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic rum-events --partitions 100 --replication-factor 1; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic rum-events-late --partitions 12 --replication-factor 1"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.12
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticsearch-init:
    image: curlimages/curl:8.8.0
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./docs/elasticsearch/rum-view-precalculate-auto-template.json:/precalculate-view-template.json:ro
      - ./docs/elasticsearch/rum-session-precalculate-auto-template.json:/precalculate-session-template.json:ro
    command: >
      sh -c "curl -fsS -X PUT http://elasticsearch:9200/_index_template/rum-view-precalculate-auto -H 'Content-Type: application/json' --data-binary @/precalculate-view-template.json && curl -fsS -X PUT http://elasticsearch:9200/_index_template/rum-session-precalculate-auto -H 'Content-Type: application/json' --data-binary @/precalculate-session-template.json"
